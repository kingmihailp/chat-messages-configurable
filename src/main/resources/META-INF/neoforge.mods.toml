[[mods]]
    modId = "kingmihailpbroadcast"
    version = "${file.jarVersion}"
    displayName = "KingMihailP Broadcast"
    logoFile = ""
    description = '''
        Broadcasts a fully-configurable message to every player on the server
        at a set time interval. Supports hex colors (#RRGGBB) and named colors.
        Use /kingmihailptext reload to hot-reload the config without a restart.
    '''

[[dependencies.kingmihailpbroadcast]]
